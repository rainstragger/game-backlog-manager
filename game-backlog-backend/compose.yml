services:
  postgres:
    image: postgres:16-alpine
    container_name: gbm-postgres
    environment:
      POSTGRES_DB: game_backlog_postgres
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: 1234
    ports:
      - "5432:5432"
    volumes:
      - gbm_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      timeout: 3s
      retries: 20

  minio:
    image: minio/minio:latest
    container_name: gbm-minio
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: admin1234
    command: server /data --console-address ":9001"
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - gbm_minio:/data

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      - minio
    restart: on-failure
    entrypoint: >
      /bin/sh -c "
      until /usr/bin/mc alias set localminio http://minio:9000 minioadmin admin1234; do
      echo 'Waiting for MinIO...';
      sleep 2;
      done;
      /usr/bin/mc mb localminio/covers || true;
      exit 0;
      "

volumes:
  gbm_pgdata:
  gbm_minio: